<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
  <title id="title">AI usage over the last 30 days</title>
  <desc id="desc">18,236 requests, 1,971,987,492 tokens, $1,778.15 total cost.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, monospace; }
    .brand { font-size: 14px; font-weight: 700; }
    .badge { font-size: 10px; font-weight: 600; }
    .label { font-size: 10px; }
    .value { font-size: 23px; font-weight: 700; }
    .token-value { font-size: 19px; font-weight: 700; }
    .section { font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .section-muted { font-size: 9px; text-transform: uppercase; }
    .model { font-size: 10px; }
    .percentage { font-size: 10px; font-weight: 700; }
    .footer { font-size: 9px; }
  </style>

  <rect x="0.5" y="0.5" width="499" height="299" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="20" cy="22" r="8" fill="#dafbe1"/>
  <circle cx="20" cy="22" r="4" fill="#1f883d"/>
  <text class="ui brand" x="34" y="27" fill="#1f2328">AI usage</text>
  <rect x="400" y="10" width="82" height="24" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="ui badge" x="441" y="26" fill="#656d76" text-anchor="middle">LAST 30 DAYS</text>
  <line x1="0" y1="44" x2="500" y2="44" stroke="#d8dee4"/>

  <text class="ui label" x="19" y="72" fill="#656d76">Total tokens</text>
  <text class="ui token-value" x="19" y="102" fill="#1f2328">1,971,987,492</text>
  <line x1="167" y1="44" x2="167" y2="120" stroke="#d8dee4"/>

  <text class="ui label" x="185" y="72" fill="#656d76">Total cost</text>
  <text class="ui value" x="185" y="102" fill="#1f2328">$1,778.15</text>
  <line x1="334" y1="44" x2="334" y2="120" stroke="#d8dee4"/>

  <text class="ui label" x="352" y="72" fill="#656d76">Requests</text>
  <text class="ui value" x="352" y="102" fill="#1f2328">18,236</text>
  <line x1="0" y1="120" x2="500" y2="120" stroke="#d8dee4"/>

  <text class="ui section" x="20" y="145" fill="#1f2328">TOP MODELS</text>
  <text class="ui section-muted" x="482" y="145" fill="#656d76" text-anchor="end">TOKEN SHARE</text>

  <text class="mono model" x="20" y="169" fill="#1f2328">gpt-5.6-sol</text>
  <rect x="172" y="163" width="255" height="6" rx="3" fill="#eaeef2"/>
  <rect x="172" y="163" width="188.4" height="6" rx="3" fill="#1f883d"/>
  <text class="ui percentage" x="482" y="169" fill="#1f2328" text-anchor="end">73.9%</text>
  <text class="mono model" x="20" y="193" fill="#1f2328">gpt-5.6-terra</text>
  <rect x="172" y="187" width="255" height="6" rx="3" fill="#eaeef2"/>
  <rect x="172" y="187" width="29.1" height="6" rx="3" fill="#0969da"/>
  <text class="ui percentage" x="482" y="193" fill="#1f2328" text-anchor="end">11.4%</text>
  <text class="mono model" x="20" y="217" fill="#1f2328">codex-auto-review</text>
  <rect x="172" y="211" width="255" height="6" rx="3" fill="#eaeef2"/>
  <rect x="172" y="211" width="28.8" height="6" rx="3" fill="#bc4c00"/>
  <text class="ui percentage" x="482" y="217" fill="#1f2328" text-anchor="end">11.3%</text>
  <text class="mono model" x="20" y="241" fill="#1f2328">Others</text>
  <rect x="172" y="235" width="255" height="6" rx="3" fill="#eaeef2"/>
  <rect x="172" y="235" width="8.7" height="6" rx="3" fill="#656d76"/>
  <text class="ui percentage" x="482" y="241" fill="#1f2328" text-anchor="end">3.4%</text>

  <rect x="0.5" y="270" width="499" height="29.5" fill="#f6f8fa"/>
  <line x1="0" y1="270" x2="500" y2="270" stroke="#d8dee4"/>
  <text class="ui footer" x="18" y="289" fill="#656d76">Jul 20 - Aug 18</text>
  <text class="ui footer" x="482" y="289" fill="#656d76" text-anchor="end">Updated Aug 18 / 03:49 CST</text>
  <rect x="0.5" y="0.5" width="499" height="299" rx="6" fill="none" stroke="#d0d7de"/>
