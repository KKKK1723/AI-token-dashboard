<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300" role="img" aria-labelledby="title desc">
  <title id="title">AI usage over the last 30 days</title>
  <desc id="desc">9,106 requests, 1,707,670,613 tokens, $988.67 total cost.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, monospace; }
    .brand { font-size: 14px; font-weight: 700; }
    .badge { font-size: 10px; font-weight: 600; }
    .label { font-size: 10px; }
    .value { font-size: 23px; font-weight: 700; }
    .section { font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .section-muted { font-size: 9px; text-transform: uppercase; }
    .model { font-size: 10px; }
    .percentage { font-size: 10px; font-weight: 700; }
    .footer { font-size: 9px; }
  </style>

  <rect x="0.5" y="0.5" width="499" height="299" rx="6" fill="#0d1117" stroke="#30363d"/>
  <circle cx="20" cy="22" r="8" fill="#17351f"/>
  <circle cx="20" cy="22" r="4" fill="#3fb950"/>
  <text class="ui brand" x="34" y="27" fill="#f0f6fc">AI usage</text>
  <rect x="400" y="10" width="82" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <text class="ui badge" x="441" y="26" fill="#8b949e" text-anchor="middle">LAST 30 DAYS</text>
  <line x1="0" y1="44" x2="500" y2="44" stroke="#30363d"/>

  <text class="ui label" x="19" y="72" fill="#8b949e">Total tokens</text>
  <text class="ui value" x="19" y="102" fill="#f0f6fc">1.708B</text>
  <line x1="167" y1="44" x2="167" y2="120" stroke="#30363d"/>

  <text class="ui label" x="185" y="72" fill="#8b949e">Total cost</text>
  <text class="ui value" x="185" y="102" fill="#f0f6fc">$988.67</text>
  <line x1="334" y1="44" x2="334" y2="120" stroke="#30363d"/>

  <text class="ui label" x="352" y="72" fill="#8b949e">Requests</text>
  <text class="ui value" x="352" y="102" fill="#f0f6fc">9,106</text>
  <line x1="0" y1="120" x2="500" y2="120" stroke="#30363d"/>

  <text class="ui section" x="20" y="145" fill="#f0f6fc">TOP MODELS</text>
  <text class="ui section-muted" x="482" y="145" fill="#8b949e" text-anchor="end">TOKEN SHARE</text>

  <text class="mono model" x="20" y="177" fill="#f0f6fc">gpt-5.6-sol</text>
  <rect x="172" y="171" width="255" height="6" rx="3" fill="#21262d"/>
  <rect x="172" y="171" width="184.9" height="6" rx="3" fill="#3fb950"/>
  <text class="ui percentage" x="482" y="177" fill="#f0f6fc" text-anchor="end">72.5%</text>
  <text class="mono model" x="20" y="205" fill="#f0f6fc">gpt-5.5</text>
  <rect x="172" y="199" width="255" height="6" rx="3" fill="#21262d"/>
  <rect x="172" y="199" width="32.8" height="6" rx="3" fill="#58a6ff"/>
  <text class="ui percentage" x="482" y="205" fill="#f0f6fc" text-anchor="end">12.9%</text>
  <text class="mono model" x="20" y="233" fill="#f0f6fc">claude-opus-4-8</text>
  <rect x="172" y="227" width="255" height="6" rx="3" fill="#21262d"/>
  <rect x="172" y="227" width="17.8" height="6" rx="3" fill="#d29922"/>
  <text class="ui percentage" x="482" y="233" fill="#f0f6fc" text-anchor="end">7.0%</text>

  <rect x="0.5" y="270" width="499" height="29.5" fill="#161b22"/>
  <line x1="0" y1="270" x2="500" y2="270" stroke="#30363d"/>
  <text class="ui footer" x="18" y="289" fill="#8b949e">Jun 26 - Jul 25</text>
  <text class="ui footer" x="482" y="289" fill="#8b949e" text-anchor="end">Updated Jul 25 / 15:44 CST</text>
  <rect x="0.5" y="0.5" width="499" height="299" rx="6" fill="none" stroke="#30363d"/>
