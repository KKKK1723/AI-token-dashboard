  <rect x="0.5" y="270" width="499" height="29.5" fill="#161b22"/>
  <line x1="0" y1="270" x2="500" y2="270" stroke="#30363d"/>
  <text class="ui footer" x="18" y="289" fill="#8b949e">Jul 27 - Aug 25</text>
